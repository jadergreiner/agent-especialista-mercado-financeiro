version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - AG_SECRET_KEY=${AG_SECRET_KEY}
      - DATABASE_URL=sqlite:///./backend/data/audit.sqlite
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: sqlite3:latest  # Placeholder, usar postgres se migrado
    volumes:
      - db_data:/var/lib/sqlite
    command: ["sqlite3", "/var/lib/sqlite/audit.db", ".read /dev/null"]

volumes:
  db_data: