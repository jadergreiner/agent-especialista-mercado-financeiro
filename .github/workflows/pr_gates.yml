name: PR Gates and Security Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-body-and-bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PR body references DECISAO-002 when sensitive files changed
        uses: actions/github-script@v7
        with:
          script: |
            const changed = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const sensitivePatterns = ["backend/", "docs/governanca/", "modules/"];
            const files = changed.data.map(f => f.filename);
            const touchesSensitive = files.some(fn => sensitivePatterns.some(p => fn.startsWith(p)));
            if (touchesSensitive) {
              const body = context.payload.pull_request.body || "";
              if (!body.includes("DECISAO-002")) {
                core.setFailed("PR must reference DECISAO-002 when modifying sensitive areas (backend, modules, docs/governanca). Please include 'DECISAO-002' in the PR body or create an exception.");
              }
            }

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          mkdir -p .reports
          bandit -r backend -f json -o .reports/bandit_pr.json || true

      - name: Fail if Bandit finds MEDIUM/HIGH
        run: |
          python .github/scripts/check_bandit.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest fastapi starlette httpx

      - name: Run unit tests (masking + audit)
        run: |
          pytest -q backend/tests/test_masking.py backend/tests/test_audit_middleware.py -q
