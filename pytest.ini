[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short --cov=backend --cov-report=html --cov-report=term --cov-fail-under=80
markers =
    e2e: End-to-end tests
    unit: Unit tests
    integration: Integration tests